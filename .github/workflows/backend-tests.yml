name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "ai_service/**"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ai_service/**"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:
    inputs:
      app:
        description: App test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - tutor
          - quiz

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: lamla_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lamla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key
      POSTGRES_DB_NAME: lamla_test
      POSTGRES_DB_USER: postgres
      POSTGRES_DB_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Compile legacy FastAPI service
        run: python -m compileall -q ai_service
      - name: Apply migrations
        run: python manage.py migrate --noinput
        working-directory: backend
      - name: Run selected app tests
        shell: bash
        env:
          APP: ${{ inputs.app || 'all' }}
        run: |
          if [ "$APP" = "all" ]; then
            python tests/run.py tutor quiz
          else
            python tests/run.py "$APP"
          fi
        working-directory: backend
